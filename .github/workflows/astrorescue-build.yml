name: Build AstroRescue IPA

on:
  workflow_dispatch:
  push:
    branches:
      - astrorescue-v0.3.3-seestar-guestfix
    paths:
      - "AstroRescue/**"
      - ".github/workflows/astrorescue-build.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: AstroRescue
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: AstroRescue
        run: |
          set -o pipefail
          xcodebuild \
            -project AstroRescue.xcodeproj \
            -scheme AstroRescue \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | tee xcodebuild.log

      - name: Ensure dynamic SMB framework is embedded
        working-directory: AstroRescue
        run: |
          APP="build/Build/Products/Release-iphoneos/AstroRescue.app"
          FRAMEWORK="build/Build/Products/Release-iphoneos/PackageFrameworks/AMSMB2.framework"

          echo "App linked libraries:"
          otool -L "$APP/AstroRescue"

          if otool -L "$APP/AstroRescue" | grep -q "AMSMB2.framework"; then
            mkdir -p "$APP/Frameworks"
            if [ ! -d "$APP/Frameworks/AMSMB2.framework" ]; then
              cp -R "$FRAMEWORK" "$APP/Frameworks/"
            fi
          fi

          test -f "$APP/Frameworks/AMSMB2.framework/AMSMB2"
          echo "AMSMB2 embedded successfully."

      - name: Package unsigned IPA
        working-directory: AstroRescue
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/AstroRescue.app Payload/
          test -f Payload/AstroRescue.app/Frameworks/AMSMB2.framework/AMSMB2
          zip -qry AstroRescue-v0.3.3-SEESTAR-GUESTFIX-unsigned.ipa Payload

      - name: Upload IPA and build log
        uses: actions/upload-artifact@v4
        with:
          name: AstroRescue-v0.3.3-SEESTAR-GUESTFIX
          path: |
            AstroRescue/AstroRescue-v0.3.3-SEESTAR-GUESTFIX-unsigned.ipa
            AstroRescue/xcodebuild.log
