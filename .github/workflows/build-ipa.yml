name: Build Sensei Astro
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Run image and planner regression tests
        run: swift test
      - run: xcodegen generate
      - name: Exercise editor in iPhone Simulator
        run: |
          set -euo pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcodebuild -project SenseiAstro.xcodeproj -scheme SenseiAstro -configuration Debug -destination "platform=iOS Simulator,id=$SIM_ID" -parallel-testing-enabled NO -resultBundlePath UIResults.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Save simulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sensei-Astro-UI-results
          path: UIResults.xcresult
      - name: Compile for iPhone
        run: |
          set -euo pipefail
          xcodebuild -project SenseiAstro.xcodeproj -scheme SenseiAstro -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned app
        run: |
          set -euo pipefail
          test -d 'build/Build/Products/Release-iphoneos/SenseiAstro.app'
          mkdir -p package/Payload
          cp -R 'build/Build/Products/Release-iphoneos/SenseiAstro.app' package/Payload/
          cd package
          zip -r ../Sensei-Astro-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Sensei-Astro-unsigned
          path: Sensei-Astro-unsigned.ipa
          if-no-files-found: error
