name: AstroRescue
options:
  bundleIdPrefix: com.cris
  deploymentTarget:
    iOS: "17.0"
packages:
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2
    from: 3.0.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
targets:
  AstroRescue:
    type: application
    platform: iOS
    dependencies:
      - package: AMSMB2
        embed: true
    sources:
      - path: AstroRescue
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cris.AstroRescue
        PRODUCT_NAME: AstroRescue
        MARKETING_VERSION: 0.3.3
        CURRENT_PROJECT_VERSION: 8
        INFOPLIST_FILE: AstroRescue/Info.plist
    scheme:
      gatherCoverageData: false
