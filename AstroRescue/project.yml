name: AstroRescue
options:
  bundleIdPrefix: com.cris
  deploymentTarget:
    iOS: "17.0"
packages:
  SMBClient:
    url: https://github.com/kishikawakatsumi/SMBClient.git
    exactVersion: 0.3.1
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
targets:
  AstroRescue:
    type: application
    platform: iOS
    dependencies:
      - package: SMBClient
    sources:
      - path: AstroRescue
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cris.AstroRescue
        PRODUCT_NAME: AstroRescue
        MARKETING_VERSION: 0.4.0
        CURRENT_PROJECT_VERSION: 9
        INFOPLIST_FILE: AstroRescue/Info.plist
    scheme:
      gatherCoverageData: false
