name: SenseiAstro
options:
  bundleIdPrefix: com.sensei
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.7.0"
    CURRENT_PROJECT_VERSION: "10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
targets:
  SenseiAstro:
    type: application
    platform: iOS
    sources:
      - path: SenseiAstro/App
        excludes:
          - Info.plist
      - path: SenseiAstro/Shared
      - path: SenseiAstro/UI
      - path: SenseiAstro/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sensei.astro
        PRODUCT_MODULE_NAME: SenseiAstro
        PRODUCT_NAME: SenseiAstro
        INFOPLIST_FILE: SenseiAstro/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SenseiAstroUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SenseiAstroUITests
    dependencies:
      - target: SenseiAstro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sensei.astro.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SenseiAstro
schemes:
  SenseiAstro:
    build:
      targets:
        SenseiAstro: all
    test:
      targets:
        - SenseiAstroUITests
